name: MoTouSender

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    path: Vendor/ZIPFoundation

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_ENABLE_BARE_SLASH_REGEX: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MoTouSender:
    type: application
    platform: iOS
    sources:
      - path: MoTouSender
      - path: Shared
    resources:
      - path: MoTouSender/Resources
    dependencies:
      - package: ZIPFoundation
      - target: MoTouShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motou.sender.ios
        PRODUCT_NAME: MoTouSender
        INFOPLIST_FILE: MoTouSender/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MoTouSender/Resources/MoTouSender.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

  MoTouShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MoTouShareExtension
      - path: Shared
    resources:
      - path: MoTouShareExtension/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motou.sender.ios.share
        PRODUCT_NAME: MoTouShareExtension
        INFOPLIST_FILE: MoTouShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MoTouShareExtension/MoTouShareExtension.entitlements
        SKIP_INSTALL: YES

  MoTouSenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoTouSenderTests
    dependencies:
      - target: MoTouSender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motou.sender.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MoTouSender:
    build:
      targets:
        MoTouSender: all
        MoTouSenderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MoTouSenderTests
    archive:
      config: Release
